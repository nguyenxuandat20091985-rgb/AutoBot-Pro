name: Build AutoBot Pro Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.2'
  TYPEBOT_TAG: 'v2.28.2'
  DEFAULT_WEB_URL: 'https://autobotpro.example.com'

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Checkout Typebot v2.28.2
        uses: actions/checkout@v4
        with:
          repository: baptisteArno/typebot.io
          ref: v2.28.2
          path: typebot-source
          fetch-depth: 1

      - name: Verify upstream tag and license
        working-directory: typebot-source
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match 2>/dev/null)" = "v2.28.2"
          test -f LICENSE
          grep -qi "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE

      - name: Prepare white-label source
        env:
          AUTOBOT_WORKDIR: ${{ github.workspace }}/typebot-autobotpro
        run: |
          set -euo pipefail
          chmod +x setup-autobot.sh
          ./setup-autobot.sh
          test -d "$AUTOBOT_WORKDIR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Android wrapper
        env:
          AUTOBOT_WEB_URL: ${{ vars.AUTOBOT_WEB_URL || env.DEFAULT_WEB_URL }}
        run: |
          set -euo pipefail
          flutter create --org com.autobotpro --project-name autobot_pro mobile
          cd mobile
          flutter pub add webview_flutter
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const AutoBotProApp());

          class AutoBotProApp extends StatefulWidget {
            const AutoBotProApp({super.key});
            @override State<AutoBotProApp> createState() => _AutoBotProAppState();
          }

          class _AutoBotProAppState extends State<AutoBotProApp> {
            late final WebViewController controller;
            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(NavigationDelegate())
                ..loadRequest(Uri.parse(String.fromEnvironment('AUTOBOT_WEB_URL')));
            }
            @override
            Widget build(BuildContext context) => MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'AutoBot Pro',
              home: Scaffold(body: SafeArea(child: WebViewWidget(controller: controller))),
            );
          }
          EOF
          sed -i "s|const String.fromEnvironment('AUTOBOT_WEB_URL')|String.fromEnvironment('AUTOBOT_WEB_URL', defaultValue: '$AUTOBOT_WEB_URL')|" lib/main.dart

      - name: Configure Android release signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/autobotpro-release.jks
          test -s android/app/autobotpro-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=autobotpro-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + s
          marker = 'android {'
          if marker not in s:
              raise SystemExit('android block not found')
          signing = '''android {
              val keystorePropertiesFile = rootProject.file("key.properties")
              val keystoreProperties = Properties()
              if (keystorePropertiesFile.exists()) {
                  keystoreProperties.load(FileInputStream(keystorePropertiesFile))
              }
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let { file("$it") }
                      storePassword = keystoreProperties["storePassword"] as String?
                  }
              }
          '''
          s = s.replace(marker, signing, 1)
          marker = 'buildTypes {'
          if marker not in s:
              raise SystemExit('buildTypes block not found')
          s = s.replace(marker, 'buildTypes {\n        getByName("release") {\n            signingConfig = signingConfigs.getByName("release")\n        }', 1)
          p.write_text(s)
          PY

      - name: Build Android App Bundle
        working-directory: mobile
        env:
          AUTOBOT_WEB_URL: ${{ vars.AUTOBOT_WEB_URL || env.DEFAULT_WEB_URL }}
        run: |
          set -euo pipefail
          if [[ -f android/key.properties && -f android/app/autobotpro-release.jks ]]; then
            flutter build appbundle --release --dart-define=AUTOBOT_WEB_URL="$AUTOBOT_WEB_URL"
          else
            echo 'Signing secrets are not configured; building an unsigned release bundle for CI validation.'
            flutter build appbundle --release --dart-define=AUTOBOT_WEB_URL="$AUTOBOT_WEB_URL"
          fi

      - name: Verify AAB exists
        working-directory: mobile
        run: |
          set -euo pipefail
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: autobot-pro-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        working-directory: mobile
        shell: bash
        run: |
          rm -f android/app/autobotpro-release.jks android/key.properties || true
